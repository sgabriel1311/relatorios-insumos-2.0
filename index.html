<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Insumos - Goiânia / GO</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: grid; gap: 16px; }
    header { border-bottom: 1px solid #334155; padding-bottom: 10px; }
    header h1 { font-size: 1.2rem; margin: 0; color: #0ea5e9; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    .card h2 { font-size: 0.9rem; margin: 0 0 10px 0; color: #e2e8f0; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .item { display: flex; align-items: center; gap: 10px; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .item:hover { border-color: #0ea5e9; }
    .item input { width: 18px; height: 18px; accent-color: #0ea5e9; }
    textarea { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; padding: 12px; font-size: 0.92rem; width: 100%; min-height: 140px; resize: vertical; }
    .btns { display: flex; gap: 10px; margin-top: 12px; }
    button { background: #0ea5e9; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    button:hover { background: #0284c7; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.sec { background: #334155; }
    .status { margin-top: 10px; font-size: 0.88rem; color: #38bdf8; font-weight: 600; }
    .status.err { color: #f87171; }
    .report-card { background: #1e293b; border: 1px solid #0ea5e9; border-radius: 10px; padding: 16px; margin-top: 14px; }
    .report-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .report-title { font-weight: 700; color: #38bdf8; font-size: 0.92rem; }
    .copy-btn { background: #10b981; padding: 8px 14px; font-size: 0.82rem; }
    .report-body { background: #090d16; border: 1px solid #334155; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GERADOR DE RELATÓRIOS DE INSUMOS — GOIÂNIA / GO</h1>
    </header>

    <div class="card">
      <h2>1. Assinale os Insumos</h2>
      <div class="grid" id="insumos-grid">
        <label class="item"><input type="checkbox" value="CADEIRA DE RODAS" /><span>Cadeira de Rodas</span></label>
        <label class="item"><input type="checkbox" value="CADEIRA DE BANHO COM ASSENTO" /><span>Cadeira de Banho com Assento</span></label>
        <label class="item"><input type="checkbox" value="COLCHÃO DE CAIXA DE OVO" /><span>Colchão de Caixa de Ovo</span></label>
        <label class="item"><input type="checkbox" value="FRALDAS GERIÁTRICAS" /><span>Fraldas Geriátricas</span></label>
        <label class="item"><input type="checkbox" value="CAMA HOSPITALAR" /><span>Cama Hospitalar</span></label>
      </div>
    </div>

    <div class="card">
      <h2>2. Evolução Clínica</h2>
      <textarea id="evolucao" placeholder="Cole aqui a evolução clínica do paciente..."></textarea>
      <div class="btns">
        <button type="button" id="btn-gerar">GERAR RELATÓRIOS INDIVIDUAIS</button>
        <button type="button" class="sec" id="btn-limpar">LIMPAR</button>
      </div>
      <div class="status" id="status">Pronto para gerar.</div>
    </div>

    <div id="resultados"></div>
  </div>

  <script>
    window.onerror = function(msg) {
      var st = document.getElementById("status");
      if (st) { st.className = "status err"; st.textContent = "Erro de script: " + msg; }
    };

    var WORKER_URL = "https://relatorio-insumos.lgpsluizgabriel.workers.dev";
    var btnGerar = document.getElementById("btn-gerar");
    var btnLimpar = document.getElementById("btn-limpar");
    var statusEl = document.getElementById("status");
    var resultadosEl = document.getElementById("resultados");

    btnGerar.onclick = async function() {
      var evolucao = document.getElementById("evolucao").value.trim();
      var checks = document.querySelectorAll("#insumos-grid input:checked");
      var insumos = [];
      for (var i = 0; i < checks.length; i++) { insumos.push(checks[i].value); }

      if (insumos.length === 0) {
        statusEl.className = "status err";
        statusEl.textContent = "Assinale pelo menos um insumo.";
        return;
      }
      if (!evolucao) {
        statusEl.className = "status err";
        statusEl.textContent = "Cole a evolução clínica do paciente.";
        return;
      }

      btnGerar.disabled = true;
      statusEl.className = "status";
      statusEl.textContent = "Processando " + insumos.length + " relatório(s)...";
      resultadosEl.innerHTML = "";

      var t0 = performance.now();

      try {
        var res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ evolucao: evolucao, insumos: insumos })
        });

        var texto = await res.text();
        if (!res.ok) {
          throw new Error(texto || "Erro HTTP " + res.status);
        }

        var partes = texto.split("|||");
        for (var j = 0; j < insumos.length; j++) {
          var conteudo = (partes[j] || partes[0] || "").replace(/\r\n/g, "\n").trim().toUpperCase();
          var card = document.createElement("div");
          card.className = "report-card";

          var top = document.createElement("div");
          top.className = "report-top";

          var title = document.createElement("span");
          title.className = "report-title";
          title.textContent = "RELATÓRIO " + (j + 1) + ": " + insumos[j];

          var copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "copy-btn";
          copyBtn.textContent = "COPIAR RELATÓRIO";
          (function(txt, btn) {
            btn.onclick = function() {
              navigator.clipboard.writeText(txt);
              btn.textContent = "COPIADO!";
              setTimeout(function() { btn.textContent = "COPIAR RELATÓRIO"; }, 2000);
            };
          })(conteudo, copyBtn);

          top.appendChild(title);
          top.appendChild(copyBtn);

          var body = document.createElement("div");
          body.className = "report-body";
          body.textContent = conteudo;

          card.appendChild(top);
          card.appendChild(body);
          resultadosEl.appendChild(card);
        }

        var seg = ((performance.now() - t0) / 1000).toFixed(2);
        statusEl.textContent = "Concluído em " + seg + "s!";
      } catch (err) {
        statusEl.className = "status err";
        statusEl.textContent = "Erro: " + err.message;
      } finally {
        btnGerar.disabled = false;
      }
    };

    btnLimpar.onclick = function() {
      document.getElementById("evolucao").value = "";
      var all = document.querySelectorAll("#insumos-grid input");
      for (var i = 0; i < all.length; i++) { all[i].checked = false; }
      resultadosEl.innerHTML = "";
      statusEl.className = "status";
      statusEl.textContent = "Campos limpos.";
    };
  </script>
</body>
</html>
